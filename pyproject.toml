[project]
name = "bbhunter"
version = "0.1.0"
description = "Asistente semi-automatico de bug bounty (recon + escaneo + enriquecimiento con Claude + informes). Validacion y envio siempre manuales."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "cvss>=3.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0"]

[project.scripts]
bbhunter = "bbhunter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bbhunter*"]

# -----------------------------------------------------------------------------
# Ajustes globales de BBHunter. Copia a config/settings.yaml y edítalo.
# NUNCA subas config/settings.yaml a git (ya está en .gitignore).
# -----------------------------------------------------------------------------

# --- Claude / Anthropic ---
# Puedes dejar la clave aquí O (mejor) exportar la variable de entorno
# ANTHROPIC_API_KEY, que tiene prioridad sobre este valor.
anthropic_api_key: ""                     # sk-ant-...
anthropic_model: "claude-sonnet-5-5"      # modelo para enriquecimiento/informes
anthropic_model_final: "claude-opus-5-5"  # modelo opcional para el informe final (más caro)
llm_enabled: true                          # si false, usa plantillas locales sin API

# --- Rutas de binarios (si no están en el PATH, pon la ruta absoluta) ---
tools:
  subfinder: "subfinder"
  httpx: "httpx"
  naabu: "naabu"
  nuclei: "nuclei"
  dalfox: "dalfox"

# --- Límites de seguridad globales (se combinan con las reglas del scope) ---
limits:
  global_rate_limit_rps: 10   # tope duro, nunca se supera aunque el scope permita más
  nuclei_concurrency: 25
  http_timeout_s: 10

# --- Modo simulación ---
# Si true, no ejecuta herramientas reales: genera datos de ejemplo. Útil para
# probar el pipeline/informes sin tocar ningún objetivo. Ponlo a false para real.
dry_run: false

# --- Referencias (solo consulta; NO tocan ningún objetivo) ---
# `bbhunter refs sync` descarga informes divulgados de HackerOne (dataset de
# github.com/codebygk/hackerone-bug-bounty-reports) y writeups recientes de Medium
# (RSS por etiqueta) a la base de datos local.
references:
  hackerone_url: "https://raw.githubusercontent.com/codebygk/hackerone-bug-bounty-reports/master/data/reports.json"
  medium_tags: ["bug-bounty", "bugbounty-writeup", "xss", "ssrf", "idor", "information-disclosure", "subdomain-takeover"]
  timeout_s: 60
  in_llm_prompt: true   # pasa a Claude títulos/bounties de informes similares para calibrar

# --- Base de datos y salidas ---
db_path: "data/bbhunter.sqlite"
reports_dir: "reports"

# --- Registro de auditoría ---
# Una línea JSON por cada ejecución de herramienta: cuándo, fase, comando (con
# secretos enmascarados), objetivos, límite de peticiones, código de salida y error.
# Consulta con: bbhunter audit  |  bbhunter audit --failed
audit_log: "data/audit.jsonl"

# --- Proxy (opcional) ---
# Todo el tráfico de httpx, nuclei y dalfox pasa por aquí. Ej. Burp: http://127.0.0.1:8080
proxy: ""

# --- Datos sensibles ---
# Enmascara secretos (contraseñas, claves, tokens, cookies) en la evidencia antes de
# guardarla. Se conservan los 4 primeros caracteres para demostrar que es real.
redact_evidence: true
# Qué evidencia se envía a la API de Claude: "redacted" (enmascarada) o "none" (nada).
# Usa "none" si la política del programa prohíbe compartir datos con terceros.
llm_evidence: "redacted"
